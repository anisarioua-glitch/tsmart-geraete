  var ziel=document.getElementById('ziel'), keine=document.getElementById('keine');

  var aktiv='';
  var kats=[]; DATA.forEach(function(d){ if(kats.indexOf(d.kat)===-1) kats.push(d.kat); });

  function chip(text,wert){ var b=document.createElement('button'); b.className='chip';
    b.textContent=text; b.onclick=function(){ aktiv=(aktiv===wert)?'':wert;
      [].forEach.call(katBox.children,function(c){ c.classList.toggle('an', c===b && aktiv); });

  kats.forEach(function(k){ chip(k,k); });

        '<div class="her">'+esc(d.her)+'</div>'+
        '<div class="mod">'+esc(d.mod)+'</div>'+
        '<div class="anb">'+esc((d.anb||[]).join(' · ')||'–')+'</div>'+

        '<dt>Anbindung</dt><dd>'+esc((d.anb||[]).join(', ')||'–')+'</dd>'+
        (d.sm ? '<dt>Herstellerinfo</dt><dd><a href="'+esc(d.sm)+'" target="_blank" rel="noopener">Details ansehen</a></dd>' : '')+
      '</dl></div></article>';
  }

  function zeichne(){
    var q = suche.value.trim().toLowerCase();
    var t = DATA.filter(function(d){
      if(aktiv && d.kat!==aktiv && (d.alleKat||[]).indexOf(aktiv)===-1) return false;
      if(!q) return true;
      return (d.her+' '+d.mod).toLowerCase().indexOf(q)!==-1;

    keine.hidden = t.length>0;
    [].forEach.call(ziel.querySelectorAll('.kopfz'),function(k){

    });
  }
